<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>406｜ブラウザーの更新が必要です｜OshiLog</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: #fffcf5; color: #292d48; font: 1rem/1.7 system-ui, "Noto Sans JP", sans-serif; }
      header { background: #fff; border-bottom: 1px solid #d5dee8; }
      .content { width: min(100% - 2rem, 44rem); margin-inline: auto; }
      header .content { padding-block: 1rem; font-weight: 700; font-size: 1.35rem; }
      main { flex: 1; padding-block: clamp(2rem, 8vw, 5rem); }
      article { padding: clamp(1.25rem, 5vw, 2.5rem); border: 1px solid #d5dee8; border-radius: .75rem; background: #fff; }
      .status { margin: 0 0 .5rem; font-weight: 700; color: #812c4b; }
      h1 { margin: 0 0 1rem; font-size: clamp(1.4rem, 4vw, 2rem); line-height: 1.4; }
      p { margin-block: 0 1.5rem; overflow-wrap: anywhere; }
      a { display: inline-block; padding: .7rem 1.2rem; border-radius: .35rem; background: #812c4b; color: #fff; text-decoration: none; font-weight: 700; }
      a:focus-visible { outline: 3px solid #245b8a; outline-offset: 3px; }
      footer { padding: 1rem; text-align: center; color: #4c5f73; }
    </style>
  </head>
  <body>
    <header><div class="content">OshiLog</div></header>
    <main class="content">
      <article aria-labelledby="error-title">
        <p class="status">エラー 406</p>
        <h1 id="error-title">ブラウザーの更新が必要です</h1>
        <p>最新版のブラウザーでお試しください。</p>
        <a href="/">トップページへ戻る</a>
      </article>
    </main>
    <footer>OshiLog｜推し活の記録と振り返り</footer>
  </body>
</html>
